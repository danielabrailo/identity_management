{% extends "base.html" %} {% block content %} {% load static %}

<h2>Identity Request</h2>
<!-- Username to search for -->
<div class="card p-3">
  <div class="mb-3">
    <label>Username</label>
    <input id="search" class="form-control" placeholder="Search username..." />
  </div>
  <!-- Context of request -->
  <div class="mb-3">
    <label
      >Context (What is the context you are requesting the identity?)</label
    >
    <select id="context" class="form-select"></select>
  </div>
  <!-- Reason to request identity -->
  <div class="mb-3">
    <label>Reason for Request</label>
    <textarea
      id="reason"
      class="form-control"
      rows="3"
      placeholder="Briefly explain why you are requesting this identity"
    ></textarea>
  </div>
  <!-- Button -->
  <button class="btn btn-primary mt-2" onclick="searchUsers()">Search</button>
</div>

<hr />

<div id="results"></div>

{% endblock %} {% block scripts %}
<script src="{% static 'frontend/js/user-lookup.js' %}" defer></script>
{% endblock %}
