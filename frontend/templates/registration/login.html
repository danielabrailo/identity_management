{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | MyIdentity</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}" />
  </head>

  <body class="auth-page">
    <div class="auth-container">
      <!-- Branding -->
      <div class="auth-brand">
        <div class="auth-logo">
          <i class="bi bi-shield-lock"></i>
        </div>
        <h1>MyIdentity</h1>
        <p>Your identity. Your contexts. Your control.</p>
      </div>

      <!-- Login card -->
      <div class="auth-card">
        <div class="auth-card-header">
          <h2>Welcome back</h2>
          <p>Sign in to manage your identities and privacy policies.</p>
        </div>
        <form method="post">
          {% csrf_token %} {{ form.as_p }}
          <button type="submit" class="btn btn-primary auth-submit">
            <i class="bi bi-box-arrow-in-right"></i>
            Sign In
          </button>
        </form>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <p class="auth-switch">
          Don't have an account?
          <a href="{% url 'register' %}"> Create one </a>
        </p>
      </div>

      <p class="auth-footer">Context-aware identity management</p>
    </div>
  </body>
</html>
