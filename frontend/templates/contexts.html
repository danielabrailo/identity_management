{% extends "base.html" %} {% block content %} {% load static %}
<!-- Screen header -->
<div class="page-header">
  <div>
    <h1>Context Profiles</h1>
    <p class="text-muted">
      Create different identity profiles for each context of your life.
    </p>
  </div>
  <!-- Action btn -->
  <button class="btn btn-primary" onclick="showCreateForm()">
    <i class="bi bi-plus-circle"></i>
    New Profile
  </button>
</div>

<!-- create profile form -->
<div id="form-container" class="card profile-form mt-4" style="display: none">
  <h3 id="form-title" class="mb-4">Create Profile</h3>
  <input type="hidden" id="profile-id" />

  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Context</label>
      <select id="context" class="form-select"></select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Display Name</label>
      <input id="display_name" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input id="email" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Phone</label>
      <input id="phone" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Job Title</label>
      <input id="job_title" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">LinkedIn</label>
      <input id="linkedin" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Nickname</label>
      <input id="nickname" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Organization</label>
      <input id="organization" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Pronouns</label>
      <input id="pronouns" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Location</label>
      <input id="location" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">University</label>
      <input id="university" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Website</label>
      <input id="website" class="form-control" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Preferred Contact Way</label>
      <select id="preferred_contact_way" class="form-select">
        <option value="">Select...</option>
        <option value="Email">Email</option>
        <option value="Phone">Phone</option>
        <option value="LinkedIn">LinkedIn</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="col-12">
      <label class="form-label">Bio</label>
      <textarea id="bio" class="form-control" rows="4"></textarea>
    </div>
  </div>

  <!-- Action Btns -->
  <div class="d-flex justify-content-end gap-2 mt-4">
    <button class="btn btn-secondary" onclick="hideForm()">Cancel</button>

    <button class="btn btn-primary" onclick="saveProfile()">
      <i class="bi bi-check-circle"></i>
      Save Profile
    </button>
  </div>
</div>

<!-- List of profiles -->
<div id="context-list" class="profile-grid mt-4"></div>

{% endblock %} {% block scripts %}
<script src="{% static 'frontend/js/contexts.js' %}" defer></script>
{% endblock %}
