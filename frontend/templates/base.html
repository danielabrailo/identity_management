{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ContextID</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}" />
  </head>
  <body>
    {% csrf_token %}
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand" href="{% url 'dashboard' %}">
          <i class="bi-shield-lock-fill"></i>
          MyIdentity
        </a>

        <!-- Quick actions -->
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'contexts' %}"> Profiles </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'policies' %}"> Policies </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'incoming-requests' %}">
                Requests
              </a>
            </li>
          </ul>
        </div>

        <!-- User + login / logou btns -->
        <div class="d-flex align-items-center">
          {% if user.is_authenticated %}
          <span class="navbar-user me-3">
            <i class="bi bi-person-circle"></i>
            {{ user.username }}
          </span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-primary btn-sm">
              <i class="bi bi-box-arrow-right"></i>
              Logout
            </button>
          </form>
          {% else %}
          <a class="btn btn-primary btn-sm" href="{% url 'login' %}"> Login </a>
          {% endif %}
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container mt-4">{% block content %} {% endblock %}</div>

    <script src="{% static 'frontend/js/api.js' %}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
